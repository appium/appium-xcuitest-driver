# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # to enable use of OIDC for trusted publishing and npm provenance

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js LTS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
      - run: npm install --no-package-lock
        name: Install dependencies
      - run: npm run test
        name: Run NPM Test
      - run: echo "PREV_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
        name: Record current version
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Release
      - run: echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
        name: Record released version
      # semantic-release only bumps package.json (npmPublish: false in release.config.mjs);
      # the actual publish happens below from a staged, bundled copy of the package so that
      # published node_modules never include devDependencies. Skipped when there was no release.
      - uses: appium/appium-workflows/.github/actions/publish-npm-bundle@main
        if: env.PREV_VERSION != env.NEW_VERSION
        with:
          unbundled-packages: appium-ios-remotexpc sharp
