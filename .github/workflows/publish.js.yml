# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publishing, tagging, or git changes)'
        required: true
        type: boolean
        default: true
      dist_tag:
        description: 'npm dist-tag to publish under. Set to "beta" to release this run''s branch as a beta prerelease; leave empty for a normal release.'
        required: false
        type: string
        default: ''
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # to enable use of OIDC for trusted publishing and npm provenance

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js LTS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
      - run: npm install --no-package-lock
        name: Install dependencies
      - run: npm run test
        name: Run NPM Test
      - run: echo "PREV_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
        name: Record current version
      - run: |
          dry_run_flag=""
          if [ "$DRY_RUN" = "true" ]; then
            dry_run_flag="--dry-run"
          fi
          npx semantic-release $dry_run_flag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Only opts release.config.mjs into treating this run's branch as the beta channel
          # when dist_tag was explicitly set to "beta" - see release.config.mjs's betaBranch.
          BETA_BRANCH_NAME: ${{ inputs.dist_tag == 'beta' && github.ref_name || '' }}
        name: Release
      - run: echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
        name: Record released version
      - run: |
          dist_tag="$(node -p "require('semver').prerelease('$NEW_VERSION')?.[0] ?? ''")"
          echo "NPM_DIST_TAG=$dist_tag" >> "$GITHUB_ENV"
        name: Derive npm dist-tag from released version
      # semantic-release only bumps package.json (npmPublish: false in release.config.mjs);
      # the actual publish happens below from a staged, bundled copy of the package so that
      # published node_modules never include devDependencies. Skipped when there was no release.
      - uses: appium/appium-workflows/.github/actions/publish-npm-bundle@main
        if: env.PREV_VERSION != env.NEW_VERSION
        with:
          unbundled-packages: sharp
          native-platforms: linux-x64 linux-arm64 darwin-arm64 win32-x64
          npm-dist-tag: ${{ env.NPM_DIST_TAG }}
