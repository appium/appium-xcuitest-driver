name: Functional Tests

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  SHOW_XCODE_LOG: true
  APPIUM_TEST_SERVER_PORT: '4567'
  APPIUM_TEST_SERVER_HOST: '127.0.0.1'

jobs:
  build:
    # https://github.com/actions/runner-images/tree/main/images/macos
    strategy:
      matrix:
        e2eRoot:
          - basic
          - device
          # In CI env driver tests are unstable, because it's expensive to start and stop simulators
          # - driver
          - web
          - long
          - tv
          - watch
        xcodeVersion: ['27.0-beta', '26.4', '16.4']
        include:
          - xcodeVersion: '27.0-beta'
            iosVersion: '27.0'
            deviceName: 'iPhone 17'
            tvosVersion: '27.0'
            tvosDeviceName: 'Apple TV 4K (3rd generation)'
            watchosVersion: '27.0'
            watchosDeviceName: 'Apple Watch Series 11 (46mm)'
            platform: xcode-27
          - xcodeVersion: '26.4'
            iosVersion: '26.4'
            deviceName: 'iPhone 17'
            tvosVersion: '26.4'
            tvosDeviceName: 'Apple TV 4K (3rd generation)'
            watchosVersion: '26.4'
            watchosDeviceName: 'Apple Watch Series 11 (46mm)'
            platform: macos-26
          - xcodeVersion: '16.4'
            iosVersion: '18.5'
            deviceName: 'iPhone 16'
            tvosVersion: '18.5'
            tvosDeviceName: 'Apple TV 4K (3rd generation)'
            watchosVersion: '11.5'
            watchosDeviceName: 'Apple Watch Series 10 (46mm)'
            platform: macos-15
      fail-fast: false

    runs-on: ${{ matrix.platform }}

    timeout-minutes: 90

    name: e2e
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 'lts/*'

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '${{ matrix.xcodeVersion }}'

      - run: xcrun simctl list devices available
        name: List Installed Simulators
      - run: xcrun simctl list runtimes
        name: List Runtimes
      - name: Select simulator target
        id: simTarget
        # basic/device/web/long all exercise iOS; tv/watch need their own OS/device/version.
        run: |
          case "$E2E_ROOT" in
            tv)
              echo "os=tvOS" >> "$GITHUB_OUTPUT"
              echo "deviceName=$TVOS_DEVICE_NAME" >> "$GITHUB_OUTPUT"
              echo "platformVersion=$TVOS_PLATFORM_VERSION" >> "$GITHUB_OUTPUT"
              echo "downloadPlatform=tvOS" >> "$GITHUB_OUTPUT"
              echo "wdaAppName=WebDriverAgentRunner_tvOS-Runner.app" >> "$GITHUB_OUTPUT"
              ;;
            watch)
              echo "os=watchOS" >> "$GITHUB_OUTPUT"
              echo "deviceName=$WATCHOS_DEVICE_NAME" >> "$GITHUB_OUTPUT"
              echo "platformVersion=$WATCHOS_PLATFORM_VERSION" >> "$GITHUB_OUTPUT"
              echo "downloadPlatform=watchOS" >> "$GITHUB_OUTPUT"
              echo "wdaAppName=WebDriverAgentRunner_watchOS-Runner.app" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "os=iOS" >> "$GITHUB_OUTPUT"
              echo "deviceName=$IOS_DEVICE_NAME" >> "$GITHUB_OUTPUT"
              echo "platformVersion=$IOS_PLATFORM_VERSION" >> "$GITHUB_OUTPUT"
              echo "downloadPlatform=iOS" >> "$GITHUB_OUTPUT"
              echo "wdaAppName=WebDriverAgentRunner-Runner.app" >> "$GITHUB_OUTPUT"
              ;;
          esac
        env:
          E2E_ROOT: ${{ matrix.e2eRoot }}
          IOS_DEVICE_NAME: ${{ matrix.deviceName }}
          IOS_PLATFORM_VERSION: ${{ matrix.iosVersion }}
          TVOS_DEVICE_NAME: ${{ matrix.tvosDeviceName }}
          TVOS_PLATFORM_VERSION: ${{ matrix.tvosVersion }}
          WATCHOS_DEVICE_NAME: ${{ matrix.watchosDeviceName }}
          WATCHOS_PLATFORM_VERSION: ${{ matrix.watchosVersion }}
      - name: Start Simulator UI
        # Xcode 27 replaced Simulator.app with DeviceHub.app, one directory level up from
        # Simulator.app's location (Contents/Applications instead of Contents/Developer/Applications).
        run: |
          if [ "${PLATFORM_VERSION%%.*}" -ge 27 ]; then
            open -Fn "$(xcode-select --print-path)/../Applications/DeviceHub.app"
          else
            open -Fn "$(xcode-select --print-path)/Applications/Simulator.app"
          fi
        env:
          PLATFORM_VERSION: ${{ steps.simTarget.outputs.platformVersion }}
      - name: Prepare simulator
        id: prepareSimulator
        uses: futureware-tech/simulator-action@v5
        with:
          model: '${{ steps.simTarget.outputs.deviceName }}'
          os: '${{ steps.simTarget.outputs.os }}'
          os_version: '${{ steps.simTarget.outputs.platformVersion }}'
          shutdown_after_job: false
          wait_for_boot: true
      - name: Finalize simulator boot
        run: node scripts/ci/wait-for-simulator-idle.mjs "${{ steps.prepareSimulator.outputs.udid }}"

      - run: |
          appium_ver=$(node -p "require('./package.json').peerDependencies?.appium")
          pushd "$(pwd)"
          cd ~
          npm install -g "appium@$appium_ver"
          popd
        name: Install Appium Server
      - run: |
          npm install
        name: Install dev dependencies
      - run: |
          export cwd=$(pwd)
          pushd "$cwd"
          cd ~
          appium driver install --source=local "$cwd"
          appium driver doctor xcuitest
          appium driver run xcuitest download-wda -- --platform="$DOWNLOAD_PLATFORM" --outdir=$(dirname "$PREBUILT_WDA_PATH") --kind=sim
          echo "Starting Appium server on $APPIUM_TEST_SERVER_HOST:$APPIUM_TEST_SERVER_PORT"
          nohup appium server \
            --port=$APPIUM_TEST_SERVER_PORT \
            --address=$APPIUM_TEST_SERVER_HOST \
            --relaxed-security \
            --log-no-colors \
            --log-timestamp \
            --keep-alive-timeout 1200 \
            2>&1 > "$cwd/appium.log" &

          TIMEOUT_SEC=15
          INTERVAL_SEC=1

          start_time=$(date +%s)
          while true; do
            current_time=$(date +%s)
            elapsed=$((current_time - start_time))

            if nc -z $APPIUM_TEST_SERVER_HOST $APPIUM_TEST_SERVER_PORT; then
              echo "Appium server is running after $elapsed seconds"
              popd
              cat appium.log
              exit 0
            fi

            if [[ "$elapsed" -ge "$TIMEOUT_SEC" ]]; then
              echo "${elapsed} seconds timeout reached: Appium server is NOT running"
              exit 1
            fi

            echo "Waiting $elapsed seconds for Appium server to start..."
            sleep "$INTERVAL_SEC"
          done
        name: Prepare the server
        env:
          DOWNLOAD_PLATFORM: ${{ steps.simTarget.outputs.downloadPlatform }}
          PREBUILT_WDA_PATH: ${{ github.workspace }}/wda/${{ steps.simTarget.outputs.wdaAppName }}

      - run: |
          export DEVICE_NAME="${{ matrix.deviceName }}"
          export PLATFORM_VERSION="${{ matrix.iosVersion }}"
          export TVOS_DEVICE_NAME="${{ matrix.tvosDeviceName }}"
          export TVOS_PLATFORM_VERSION="${{ matrix.tvosVersion }}"
          export WATCHOS_DEVICE_NAME="${{ matrix.watchosDeviceName }}"
          export WATCHOS_PLATFORM_VERSION="${{ matrix.watchosVersion }}"
          export SIMULATOR_UDID="${{ steps.prepareSimulator.outputs.udid }}"
          npm run "e2e-test:${{ matrix.e2eRoot }}"
        name: Run functional tests
        env:
          PREBUILT_WDA_PATH: ${{ github.workspace }}/wda/${{ steps.simTarget.outputs.wdaAppName }}

      - name: Save server output
        if: ${{ always() }}
        uses: actions/upload-artifact@master
        with:
          name: appium_e2eRoot_${{ matrix.e2eRoot }}_xCodev${{ matrix.xcodeVersion }}_v${{ steps.simTarget.outputs.platformVersion }}.log
          path: appium.log
